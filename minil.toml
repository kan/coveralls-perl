name = "Devel-Cover-Report-Coveralls"
badges = ['github-actions/master', 'github-actions/windows', 'github-actions/mac', 'coveralls']
markdown_maker = "Pod::Markdown::Github"
# The change log is CHANGELOG.md, written for tagpr (scripts/tagpr/README.md). Without this,
# minil dist tries to rewrite a `Changes` file that no longer exists.
manage_changes = false
[FileGatherer]
exclude_match = ["^docker-compose*", "^scripts/"]
