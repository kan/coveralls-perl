name: publish

# Ships a tagged version to CPAN. Started by `tagpr.yml` with `workflow_dispatch` on the tag it
# made (a tag pushed with GITHUB_TOKEN does not start `push: tags`). `push: tags` is for a tag
# pushed by hand. The jobs are the shared workflow of kan/tagpr-scripts ("The CPAN publish
# workflow" of scripts/tagpr/README.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One run per tag, never cancelled. A run stopped after the upload leaves a version on CPAN
# with no GitHub release.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # The same commit as scripts/tagpr/ (the tagpr-subtree job of master.yml checks it)
    uses: kan/tagpr-scripts/.github/workflows/publish-cpan.yml@9e7ada5d6701b53f66b956ef5abc4290a4e2045f
    permissions:
      contents: write  # read the repository, create the release
    # The PAUSE credentials are in the `cpan` environment of this repository
    secrets: inherit
    with:
      test: prove -l t
      # The Perl of Dockerfile and master.yml; scripts/check-perl-version.pl reads this line
      perl-version: '5.44'
