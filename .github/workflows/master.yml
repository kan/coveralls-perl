name: master

# Changes go in by pull request (AGENTS.md), so a working branch is tested by `pull_request`.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  perl:
    runs-on: ubuntu-latest

    strategy:
      # Let every version report its own result instead of cancelling the rest on one failure.
      fail-fast: false
      matrix:
        # perl:5.20 and older are stored in the schema 1 manifest format, which the Docker on the
        # current runners can no longer pull (containerd v2.1). perl:5.22 and 5.24 are based on
        # Debian 9 (glibc 2.24), where the Node 24 that actions/checkout runs on does not start
        # (it needs glibc 2.28). 5.26 is the oldest usable image.
        #
        # The newest one is the Perl of the development container (Dockerfile), not `latest`, so
        # that both move in the same pull request (AGENTS.md, "テスト").
        perl-version:
          - '5.26'
          - '5.28'
          - '5.44'
        # The newest one also sends this module's own coverage (Run Cover).
        include:
          - perl-version: '5.44'
            cover: true

    container:
      image: perl:${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure git
        run: git config --system --add safe.directory '*'
      - name: perl -V
        run: perl -V
      - name: Install dependencies
        run: cpanm --quiet --notest --installdeps --with-recommends --with-configure .
      - name: Run build
        run: |
            perl Build.PL
            ./Build build
            ./Build test
      - name: Run Cover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            ./Build install
            HARNESS_PERL_SWITCHES=-MDevel::Cover DEVEL_COVER_SELF=1 ./Build test
            cover -report coveralls
        if: matrix.cover

  # The minimum Perl the module declares (use 5.020). Its perl image cannot be pulled on the
  # current runners (see above), so this job installs Perl with actions-setup-perl. It downloads
  # Perl from GitHub Releases without a token, which fails with 504 whenever GitHub throttles
  # anonymous traffic; re-run the failed job then.
  oldest-perl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@v1.44.5
        with:
          perl-version: '5.20'
      - name: perl -V
        run: perl -V
      - name: Install dependencies
        run: cpanm --quiet --notest --installdeps --with-recommends --with-configure .
      - name: Run build
        run: |
            perl Build.PL
            ./Build build
            ./Build test

  # The tarball that publish.yml uploads, made the same way ("Build the tarball" there; change both
  # together), so that what goes into the distribution is checked before a release: scripts/ must
  # stay out (minil.toml). The one difference is where Perl 5.44 comes from: this job runs in the
  # perl image from Docker Hub, as actions-setup-perl fails with 504 when GitHub throttles
  # anonymous traffic (see oldest-perl); publish.yml keeps actions-setup-perl (see there).
  dist:
    runs-on: ubuntu-latest
    container:
      image: perl:5.44

    steps:
      # The whole history, as in publish.yml: Minilla makes x_contributors from `git log`.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The checkout belongs to another user than the container's root, and Minilla runs git.
      - name: Configure git
        run: git config --system --add safe.directory '*'
      # Only what `minil dist` needs: Minilla, the markdown_maker of minil.toml, and
      # Module::Build::Tiny for the Build.PL it runs.
      - name: Install Minilla
        run: cpanm --quiet --notest Minilla Pod::Markdown::Github Module::Build::Tiny
      - name: Build the tarball
        run: |
            minil dist --no-test
            files="$(tar tzf Devel-Cover-Report-Coveralls-*.tar.gz)"
            printf '%s\n' "$files"
            if printf '%s\n' "$files" | grep -q '^[^/]*/scripts/'; then
              echo "the tarball contains scripts/" >&2
              exit 1
            fi

  # The Perl of the development container (Dockerfile) must be the newest version of the perl
  # matrix, the dist container, the docker-compose.yml volume and publish.yml (AGENTS.md, "テスト").
  # Dependabot updates only the Dockerfile. The versions stay written out in each file instead of
  # being read from the Dockerfile: that would need a job passing the version to the others, and
  # publish.yml is another workflow. A literal image (dist) can also be pinned by digest, which
  # `gh actions-lock` suggests; one built from an expression cannot be checked by it.
  perl-version-sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check the Perl versions against the Dockerfile
        run: perl scripts/check-perl-version.pl

  # scripts/tagpr/ must be the tagpr-scripts commit that tagpr.yml calls (scripts/tagpr/README.md).
  tagpr-subtree:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Check scripts/tagpr/ against the tagpr workflow pin
        run: node scripts/tagpr/verify-subtree.mjs
