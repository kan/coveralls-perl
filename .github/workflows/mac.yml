name: mac

# Changes go in by pull request (AGENTS.md), so a working branch is tested by `pull_request`.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  perl:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: perl -V
        run: perl -V
      # Homebrew's default openssl is 4.x, which Net::SSLeay 1.96 does not build against.
      # Build it against openssl@3 instead.
      - name: Install OpenSSL 3
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install openssl@3
      - name: Install dependencies
        run: |
          export OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          curl -sL https://git.io/cpm | perl - install -g --with-recommends --with-test --with-configure --show-build-log-on-failure
      - name: Run build
        run: perl Build.PL
      - name: Run test
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: ./Build build && ./Build test
