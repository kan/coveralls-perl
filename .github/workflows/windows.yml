name: windows

# Changes go in by pull request (AGENTS.md), so a working branch is tested by `pull_request`.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  perl:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Perl
        run: |
          choco install strawberryperl
          Add-Content $env:GITHUB_PATH "C:\strawberry\c\bin;C:\strawberry\perl\site\bin;C:\strawberry\perl\bin"
      - name: perl -V
        run: perl -V
      - name: Install dependencies
        run: cpanm --quiet --notest --installdeps --with-recommends --with-configure .
      - name: Run build
        run: perl Build.PL
      - name: Run test
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: ./Build build && ./Build test
